name: Publish

# Manual semver: bump the changed packages' "version" in package.json, commit,
# then push a tag `vX.Y.Z` (or run this workflow manually). pnpm publishes every
# package whose current version isn't yet on npm — in dependency order — and
# skips the ones already published, so mixed-version releases just work.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2 # match the repo's pnpm; newer 11.x needs Node >= 22.13

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `--filter '!./examples/*'` on all three: examples joined the workspace so
      # they'd consume workspace:* and break when the packages break, but that also
      # put them on the release critical path — a stray unused import in a demo
      # would fail the build *after* the version tag was pushed and block publishing
      # every SDK package. Their gate is ci.yml, which runs before a tag exists.
      - run: pnpm -r --filter '!./examples/*' build

      - run: pnpm -r --filter '!./examples/*' typecheck

      # Tests too, so a release cannot ship a silent base64url regression even if
      # someone tags without a green CI run.
      - run: pnpm -r --filter '!./examples/*' test

      # Publishes @elaanio/core → react-core → react/react-native in dependency
      # order, rewriting workspace:* to real versions. --no-git-checks because the
      # tag checkout is detached; access comes from each package's publishConfig.
      - run: pnpm -r --filter '!./examples/*' publish --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
